Значит, GitHub, вероятно, не загрузил скрытую папку `.github` — на Android это бывает. Её можно создать прямо на GitHub.

Сначала на вкладке **Code** проверь, что в корне репозитория есть папка **`pas1`**. Внутри неё должны быть `CMakeLists.txt`, `Source` и `Tests`. Если папки `pas1` нет, остановись: файлы загружены не в той структуре.

Если `pas1` на месте:

1. На странице репозитория нажми **“creating a new file”** — эта ссылка находится в блоке **Quick setup**.
2. В поле имени файла введи точно:
   `.github/workflows/pas1-build.yml`
   
   GitHub создаст недостающие папки сам.
3. Вставь содержимое workflow из блока ниже.
4. Нажми **Commit changes** и подтверди коммит. После этого открой **Actions** — workflow должен появиться и запуститься.

```yaml
name: PAS 1 build

on:
  push:
    paths:
      - "pas1/**"
      - ".github/workflows/pas1-build.yml"
  pull_request:
    paths:
      - "pas1/**"
      - ".github/workflows/pas1-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: DSP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure DSP tests
        run: cmake -S pas1 -B pas1/build-tests -DPAS1_BUILD_PLUGIN=OFF -DPAS1_BUILD_TESTS=ON
      - name: Build DSP tests
        run: cmake --build pas1/build-tests --config Release --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir pas1/build-tests --build-config Release --output-on-failure

  plugin:
    name: VST3 and Standalone (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio and GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libgl1-mesa-dev libgtk-3-dev
      - name: Configure
        run: cmake -S pas1 -B pas1/build -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3, Standalone, and tests
        run: cmake --build pas1/build --config Release --parallel 2
      - name: Run DSP tests
        run: ctest --test-dir pas1/build --build-config Release --output-on-failure
      - name: Upload plugin and standalone
        uses: actions/upload-artifact@v4
        with:
          name: PAS1-${{ runner.os }}
          path: |
            pas1/build/PAS1_artefacts/Release/VST3/
            pas1/build/PAS1_artefacts/Release/Standalone/
            pas1/build/PAS1_artefacts/VST3/
            pas1/build/PAS1_artefacts/Standalone/
          if-no-files-found: error
```
